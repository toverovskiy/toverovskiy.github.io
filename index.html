    <script>
      const artwork = document.querySelector('.home-artwork__viewport');
      if (matchMedia('(max-width: 716px)').matches) {
        artwork.scrollLeft = (artwork.scrollWidth - artwork.clientWidth) / 2;
      }

      const socialItems = [...document.querySelectorAll('.social-links__item')];
      function updateSocialSeparators() {
        socialItems.forEach(item => item.classList.remove('social-links__item--row-end'));
        socialItems.forEach((item, index) => {
          if (socialItems[index + 1]?.offsetTop > item.offsetTop) {
            item.classList.add('social-links__item--row-end');
          }
        });
      }
      updateSocialSeparators();
      addEventListener('resize', updateSocialSeparators);
      document.fonts.ready.then(updateSocialSeparators);
    </script>
